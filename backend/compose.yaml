name: lavan-local
services:
  api:
    build: .
    environment:
      ARTIFACT_STORAGE_DIR: /var/lib/lavan/artifacts
      ZIP_MAX_COMPRESSED_BYTES: ${ZIP_MAX_COMPRESSED_BYTES:-52428800}
      ZIP_MAX_UNCOMPRESSED_BYTES: ${ZIP_MAX_UNCOMPRESSED_BYTES:-209715200}
      ZIP_MAX_ENTRIES: ${ZIP_MAX_ENTRIES:-2000}
      ZIP_MAX_FILE_BYTES: ${ZIP_MAX_FILE_BYTES:-52428800}
      ZIP_MAX_FILENAME_CHARS: ${ZIP_MAX_FILENAME_CHARS:-512}
      UPLOAD_MAX_SECONDS: ${UPLOAD_MAX_SECONDS:-60}
      UPLOAD_MAX_ACTIVE: ${UPLOAD_MAX_ACTIVE:-2}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifact_data:/var/lib/lavan/artifacts
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["/app/.venv/bin/python", "-m", "lavan.worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-5}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-0.1}
      WORKER_RETRY_SECONDS: ${WORKER_RETRY_SECONDS:-1}
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-success}
      SIMULATOR_STARTUP_SECONDS: ${SIMULATOR_STARTUP_SECONDS:-0.1}
      SIMULATOR_SLOW_STARTUP_SECONDS: ${SIMULATOR_SLOW_STARTUP_SECONDS:-3}
      SIMULATOR_DURATION_SECONDS: ${SIMULATOR_DURATION_SECONDS:-0.2}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
volumes:
  postgres_data:
  artifact_data:
