[project]
name = "lavan-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
